# Publishes `crafvy` to PyPI when a version tag (v1.2.3) is pushed — the tag
# pnpm sdk:sync-public sets. Uses PyPI's trusted publishing: on pypi.org,
# add this repository and the workflow `release.yml` as a trusted publisher
# of the project (no token to store).
name: Release
on:
  push:
    tags: ["v*"]
jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tests (the shared conformance suite)
        run: PYTHONPATH=src python -m unittest discover -s tests -v
      - name: The tag is the package's version
        run: test "v$(sed -n 's/^version = "\(.*\)"/\1/p' pyproject.toml)" = "$GITHUB_REF_NAME"
      - run: python -m pip install build && python -m build
      - uses: pypa/gh-action-pypi-publish@release/v1
